<!DOCTYPE html>
<html lang="en" ng-app="weatherApp">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fa; padding: 20px; }
        #container {
            width: 500px; margin: auto; background: white; padding: 20px;
            border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .forecast-box {
            background: #e8eef5; padding: 10px; margin: 5px 0; border-radius: 5px;
        }
        button {
            padding: 10px 15px; margin-top: 10px; cursor: pointer; border: none; color: white;
        }
        #getBtn { background: #4caf50; }
        #resetBtn { background: #ff5656; }
    </style>
</head>

<body ng-controller="weatherCtrl">

    <div id="container">
        <h2>Weather Dashboard</h2>

        <p><b>Current Date & Time:</b> {{ currentTime }}</p>

        <input type="text" ng-model="city" placeholder="Enter city name">
        <br>
        <button id="getBtn" ng-click="getWeather()">Get Weather</button>
        <button id="resetBtn" ng-click="resetAll()">Reset</button>

        <div id="weatherData" style="display:none; margin-top:20px;">
            <h3>Current Weather for {{ formattedCity }}</h3>
            <p><b>Temperature:</b> {{ temperature }} °C</p>
            <p><b>Description:</b> {{ description }}</p>
            <p><b>Humidity:</b> {{ humidity }}%</p>

            <h3>5-Day Forecast</h3>
            <div id="forecast"></div>
        </div>
    </div>

    <script>
        var app = angular.module("weatherApp", []);

        app.controller("weatherCtrl", function($scope, $interval) {

            function updateClock() {
                $scope.currentTime = new Date().toLocaleString();
            }
            updateClock();
            $interval(updateClock, 1000);

            $scope.getWeather = function() {
                let city = $scope.city;

                if (!city) {
                    alert("Please enter a city name");
                    return;
                }

                $scope.formattedCity = city.charAt(0).toUpperCase() + city.slice(1);

                let apiKey = "YOUR_OPENWEATHERMAP_API_KEY"; // Replace with your OpenWeatherMap API key

                let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

                $.ajax({
                    url: url,
                    method: "GET",
                    success: function(data) {
                        $scope.$apply(function(){
                            $scope.temperature = data.main.temp;
                            $scope.description = data.weather[0].description;
                            $scope.humidity = data.main.humidity;
                        });
                        $("#weatherData").show();
                    },
                    error: function() {
                        alert("City not found");
                    }
                });

                let forecastURL = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`;

                $.ajax({
                    url: forecastURL,
                    method: "GET",
                    success: function(data) {
                        let list = data.list;
                        let forecastArray = [];

                        for (let i = 0; i < list.length; i += 8) {
                            forecastArray.push(list[i]);
                        }

                        $("#forecast").html("");
                        forecastArray.forEach(day => {
                            $("#forecast").append(`
                                <div class="forecast-box">
                                    <b>${day.dt_txt.split(" ")[0]}</b><br>
                                    Temp: ${day.main.temp} °C<br>
                                    ${day.weather[0].description}
                                </div>
                            `);
                        });
                    }
                });
            };

            $scope.resetAll = function() {
                $scope.city = "";
                $("#weatherData").hide();
                $("#forecast").html("");
            };

        });
    </script>

</body>
</html>
